name: 'Rebol-Zlib-ng CI'
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.2

    - name: Set Siskin locations
      shell: bash
      run: |
        tee -a "$GITHUB_ENV" <<EOF
        SISKIN_TEMP=$RUNNER_TEMP/siskin
        SISKIN_INSTALL=$GITHUB_WORKSPACE/deps
        REBOL_MODULES_DIR=$GITHUB_WORKSPACE
        EOF

    - name: Build 64bit static Zlib-ng library
      run: ./siskin Rebol-Zlib-ng.nest cmake-zlib-ng-x64
    - name: Build 64bit Rebol/Zlib-ng extension
      run: ./siskin Rebol-Zlib-ng.nest -o ./zlib-ng-windows-x64.rebx --msvc zlib-ng-x64
    - name: Minimal Rebol/Zlib-ng extension test
      run:  ./siskin --script ci-test.r3

    - name: Build 32bit static Zlib-ng library
      run: ./siskin Rebol-Zlib-ng.nest cmake-zlib-ng-x86
    - name: Build 32bit Rebol/Zlib-ng extension
      run: ./siskin Rebol-Zlib-ng.nest -o ./zlib-ng-windows-x86.rebx --msvc zlib-ng-x86

    - name: Build arm64 static Zlib-ng library
      run: ./siskin Rebol-Zlib-ng.nest cmake-zlib-ng-arm64
    - name: Build arm64 Rebol/Zlib-ng extension
      run: ./siskin Rebol-Zlib-ng.nest -o ./zlib-ng-windows-arm64.rebx --msvc zlib-ng-arm64

    - name: Upload unsigned artifact
      id: upload-unsigned
      uses: actions/upload-artifact@v6
      with:
        name: Rebol-Zlib-ng-Windows-CI-${{github.run_id}}-unsigned
        path: ./*.rebx

    - name: Sign with SignPath
      if: github.event_name != 'pull_request'
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
        project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
        signing-policy-slug: 'test-signing'
        #signing-policy-slug: ${{ github.event_name == 'workflow_dispatch' && 'release-signing' || 'test-signing' }}
        artifact-configuration-slug: 'windows-rebx'
        github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
        wait-for-completion: true
        output-artifact-directory: './signed'

    - name: Upload signed artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v6
      with:
        name: Rebol-Zlib-ng-Windows-CI-${{github.run_id}}-signed
        path: ./signed/*.rebx


  linux:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]

    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.2

    - name: Set Siskin locations
      shell: bash
      run: |
        tee -a "$GITHUB_ENV" <<EOF
        SISKIN_TEMP=$RUNNER_TEMP/siskin
        SISKIN_INSTALL=$GITHUB_WORKSPACE/deps
        REBOL_MODULES_DIR=$GITHUB_WORKSPACE
        EOF

    - name: Build 64bit static Zlib-ng library
      run: ./siskin Rebol-Zlib-ng.nest cmake-zlib-ng-x64
    - name: Build 64bit Rebol/Zlib-ng extension
      run: ./siskin Rebol-Zlib-ng.nest -o ./zlib-ng-linux-x64.rebx --gzip zlib-ng-x64
    - name: Minimal Rebol/Zlib-ng extension test
      run:  ./siskin --script ci-test.r3

    - name: "[INSTALL] Multilib"
      run: |
        sudo rm -rf /var/lib/apt/lists/*
        sudo apt-get update
        sudo apt-get install -y gcc-multilib g++-multilib
    - name: Build 32bit static Zlib-ng library
      run: ./siskin Rebol-Zlib-ng.nest cmake-zlib-ng-x86
    - name: Build 32bit Rebol/Zlib-ng extension
      run: ./siskin Rebol-Zlib-ng.nest -o ./zlib-ng-linux-x86.rebx --gzip zlib-ng-x86

    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-Zlib-ng-Linux-CI-${{github.run_id}}
        path: ./*.gz

  macos-arm:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.2
      with:
        arch: aarch64

    - name: Set Siskin locations
      shell: bash
      run: |
        tee -a "$GITHUB_ENV" <<EOF
        SISKIN_TEMP=$RUNNER_TEMP/siskin
        SISKIN_INSTALL=$GITHUB_WORKSPACE/deps
        REBOL_MODULES_DIR=$GITHUB_WORKSPACE
        EOF

    - name: Build arm64 static Zlib-ng library
      run: ./siskin Rebol-Zlib-ng.nest cmake-zlib-ng-arm64

    - name: Build arm64 Rebol/Zlib-ng extension
      run: ./siskin Rebol-Zlib-ng.nest -o ./zlib-ng-macos-arm64.rebx --gzip zlib-ng-arm64

    - name: Minimal Rebol/Zlib-ng extension test
      run:  ./siskin --script ci-test.r3

    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-Zlib-ng-macOS-arm-CI-${{github.run_id}}
        path: ./*.gz

  macos-x64:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.2

    - name: Set Siskin locations
      shell: bash
      run: |
        tee -a "$GITHUB_ENV" <<EOF
        SISKIN_TEMP=$RUNNER_TEMP/siskin
        SISKIN_INSTALL=$GITHUB_WORKSPACE/deps
        REBOL_MODULES_DIR=$GITHUB_WORKSPACE
        EOF

    - name: Build x64 static Zlib-ng library
      run: ./siskin Rebol-Zlib-ng.nest cmake-zlib-ng-x64
    - name: Build x64 Rebol/Zlib-ng extension
      run: ./siskin Rebol-Zlib-ng.nest -o ./zlib-ng-macos-x64.rebx --gzip zlib-ng-x64
    - name: Minimal Rebol/Zlib-ng extension test
      run:  ./siskin --script ci-test.r3

    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-Zlib-ng-macOS-x64-CI-${{github.run_id}}
        path: ./*.gz
